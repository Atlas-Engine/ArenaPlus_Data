name: Discord Notifications

on:
push:
tags:
- '*.*.*.*'

permissions:
contents: read

jobs:
wait-for-curseforge:
name: Wait for CurseForge
runs-on: ubuntu-latest

```
steps:
  - name: Wait for exact version on CurseForge
    env:
      CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
      CURSEFORGE_PROJECT_ID: '1672414'
      VERSION: ${{ github.ref_name }}
    run: |
      python - <<'PY'
      import json
      import os
      import sys
      import time
      import urllib.error
      import urllib.request

      api_key = os.environ["CURSEFORGE_API_KEY"]
      project_id = os.environ["CURSEFORGE_PROJECT_ID"]
      expected_version = os.environ["VERSION"]

      # Poll every 30 seconds for up to 30 minutes.
      max_attempts = 60
      wait_seconds = 30

      url = (
          f"https://api.curseforge.com/v1/mods/"
          f"{project_id}/files?pageSize=50&index=0"
      )

      headers = {
          "Accept": "application/json",
          "x-api-key": api_key,
          "User-Agent": "Atlas-Engine-GitHub-Actions"
      }

      print(
          f"Waiting for CurseForge to publish exact version "
          f"{expected_version}..."
      )

      for attempt in range(1, max_attempts + 1):
          print(
              f"\nAttempt {attempt}/{max_attempts}: "
              f"checking CurseForge..."
          )

          try:
              request = urllib.request.Request(
                  url,
                  headers=headers,
                  method="GET"
              )

              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(
                          f"CurseForge returned HTTP {response.status}"
                      )

                  data = json.load(response)

              files = data.get("data", [])

              for file in files:
                  # CurseForge file objects expose the version
                  # under the displayName / fileName fields depending
                  # on how the project was published. We require an
                  # exact match against the Git tag.
                  display_name = str(
                      file.get("displayName", "")
                  ).strip()

                  file_name = str(
                      file.get("fileName", "")
                  ).strip()

                  game_versions = file.get(
                      "gameVersions", []
                  )

                  print(
                      f"Found CurseForge file: "
                      f"{display_name or file_name}"
                  )

                  # Exact version matching.
                  if (
                      display_name == expected_version
                      or file_name == expected_version
                  ):
                      file_id = file.get("id")
                      download_url = file.get("downloadUrl")
                      file_url = file.get("fileName")

                      print(
                          f"\nSUCCESS: CurseForge contains "
                          f"exact version {expected_version}"
                      )
                      print(f"CurseForge file ID: {file_id}")

                      # Export values for the next step.
                      with open(
                          os.environ["GITHUB_ENV"],
                          "a",
                          encoding="utf-8"
                      ) as env_file:
                          env_file.write(
                              f"CURSEFORGE_FILE_ID={file_id}\n"
                          )

                      sys.exit(0)

          except urllib.error.HTTPError as error:
              print(
                  f"CurseForge API returned HTTP {error.code}"
              )

          except urllib.error.URLError as error:
              print(
                  f"Could not reach CurseForge: {error}"
              )

          except Exception as error:
              print(
                  f"Unexpected error while checking CurseForge: "
                  f"{error}"
              )

          if attempt < max_attempts:
              print(
                  f"Not published yet. "
                  f"Waiting {wait_seconds} seconds..."
              )
              time.sleep(wait_seconds)

      print(
          f"\nTIMEOUT: CurseForge did not publish exact version "
          f"{expected_version} within 30 minutes."
      )

      print(
          "No Discord notification will be sent."
      )

      sys.exit(1)

  - name: Send release to Discord
    if: success()
    env:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
      VERSION: ${{ github.ref_name }}
      REPOSITORY: ${{ github.repository }}
      REPOSITORY_URL: ${{ github.event.repository.html_url }}
      CURSEFORGE_PROJECT_ID: '1672414'
      CURSEFORGE_FILE_ID: ${{ env.CURSEFORGE_FILE_ID }}
    run: |
      python - <<'PY'
      import json
      import os
      import urllib.request

      webhook = os.environ["DISCORD_WEBHOOK"]
      version = os.environ["VERSION"]
      repository = os.environ["REPOSITORY"]
      repository_url = os.environ["REPOSITORY_URL"]
      project_id = os.environ["CURSEFORGE_PROJECT_ID"]
      file_id = os.environ["CURSEFORGE_FILE_ID"]

      curseforge_url = (
          f"https://www.curseforge.com/wow/addons/"
          f"arenaplus-data"
      )

      tag_url = (
          f"https://github.com/{repository}/releases/tag/"
          f"{version}"
      )

      payload = {
          "username": "Atlas-Engine",
          "embeds": [
              {
                  "title": f"🚀 ArenaPlus Data {version}",
                  "url": curseforge_url,
                  "description": (
                      "**A new ArenaPlus Data release is now "
                      "available on CurseForge!**\n\n"
                      f"Version `{version}` has been successfully "
                      "published and verified."
                  ),
                  "color": 5793266,
                  "fields": [
                      {
                          "name": "📦 Version",
                          "value": f"`{version}`",
                          "inline": True
                      },
                      {
                          "name": "📚 Source",
                          "value": (
                              f"[GitHub]({tag_url})"
                          ),
                          "inline": True
                      },
                      {
                          "name": "☁️ Distribution",
                          "value": (
                              f"[CurseForge]({curseforge_url})"
                          ),
                          "inline": True
                      }
                  ],
                  "footer": {
                      "text": "Atlas-Engine • ArenaPlus"
                  }
              }
          ]
      }

      data = json.dumps(payload).encode("utf-8")

      request = urllib.request.Request(
          webhook,
          data=data,
          headers={
              "Content-Type": "application/json",
              "User-Agent": "Atlas-Engine-GitHub-Actions"
          },
          method="POST"
      )

      with urllib.request.urlopen(request, timeout=30) as response:
          if not 200 <= response.status < 300:
              raise RuntimeError(
                  f"Discord returned HTTP {response.status}"
              )

      print(
          f"Discord notification sent successfully for "
          f"ArenaPlus Data {version}."
      )
      PY
```
